<!DOCTYPE html>
<html>
<head>
    <title>Update Trek Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<h2>{{ trek["name"] }}</h2>
<form method="POST">
<select name="status">
<option value="Open" {% if trek["status"]=="Open" %}selected{% endif %}>Open</option>
<option value="Closed" {% if trek["status"]=="Closed" %}selected{% endif %}> Closed </option>
<option value="Completed" {% if trek["status"]=="Completed" %}selected{% endif %}>Completed</option>
</select>

<br><br>

<button type="submit" class="sbtn"> Update Status </button>
</form>

<br>

<a href="/staff_dashboard" class="sbtn">Back</a>

</body>
</html>
