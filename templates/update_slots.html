<!DOCTYPE html>
<html>
<head>
    <title>Update Slots</title>

</head>
<body style="margin: 15px auto;">
<h2>Update Available Slots</h2> <br>

</form>
<br>
<a href="/staff_dashboard" class="staff-btn">Back</a>

</body>
</html>
