{% extends "base.html" %}
{% block content %}
<h1>Add Trek</h1>
<form method="POST">
    <input type="text" name="name" placeholder="Trek" required>
    <input type="text" name="location" placeholder="Location" required><br><br>
    <input type="number" name="price" placeholder="Price" required><br><br>
    <input type="number" name="slots" placeholder=" Available Slots" required><br><br>
    <button type="submit">Add Trek</button>


</form>
{% endblock %}
