<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav style="background:#1D2228; padding:15px;">
        <a href="/" style="color:azure; margin-right:15px;">Home</a>
        <a href="/my_bookings" style="color:azure; margin-right:15px;">History</a>
        <a href="/view_treks" style="color:azure; margin-right:15px;">View Treks</a>
        <a href="/contact" style="color:azure; margin-right:15px;">Contact</a>
        <a href="/login" style="color:azure; margin-right:15px;">Login</a>
        <a href="/logout" style="color:azure; margin-right:15px;">Logout</a>
    </nav>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div style="
                    width:80%;
                    margin:15px auto;
                    padding:12px;
                    background:#d4edda;
                    color:#155724;
                    border:1px solid #c3e6cb;
                    border-radius:5px;
                    text-align:center;
                    font-weight:bold;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}
    {% endblock %}

</body>
</html>
