<table>
<tr>
    <th>Name</th>
    <th>Location</th>
    <th>Price</th>
    <th>Booking Date</th>
    <th>Status</th>
</tr>
{% for booking in bookings %}
<tr>
    <td>{{ booking["name"] }}</td>
    <td>{{ booking["location"] }}</td>
    <td>{{ booking["price"] }}</td>
    <td>{{ booking["booking_date"] }}</td>
    <td>{{ booking["status"] }}</td>
</tr>

{% endfor %}

</table>
